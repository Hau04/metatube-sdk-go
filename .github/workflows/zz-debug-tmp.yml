name: debug-tmp
on: pull_request
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: |
          go vet ./provider/javdb/ ./provider/fc2hub/ 2>&1 | head -20 | while IFS= read -r l; do echo "::error::VET $l"; done
          gofmt -l provider/ | while IFS= read -r l; do echo "::error::FMT $l"; done
          go test -count=1 -v ./provider/javdb/ ./provider/fc2hub/ -run 'Fixture|Rewrite|Poster|Candidates|Fetch|Search|GetMovie|Clean|Build|LDJSON' > out.txt 2>&1 || true
          grep -E -- "--- FAIL|_test.go:[0-9]+|Error:|expected|actual|panic|FAIL|cannot|undefined" out.txt | head -40 | while IFS= read -r l; do echo "::error::T $l"; done
